<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ricerca rapportini · COMP.HAS</title>
<link rel="icon" type="image/png" sizes="192x192" href="./assets/icone/icona-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="./css/variables.css">
<style>
  /* Ricerca dal computer: stessi colori dell'app (css/variables.css), impaginazione per schermi larghi. */
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--sfondo);color:var(--testo);font:15px/1.45 var(--font)}
  .barra{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s6);background:var(--superficie);border-bottom:1px solid var(--bordo)}
  .barra h1{margin:0;font-size:18px;flex:1;min-width:0}
  .barra a{color:var(--azzurro);font-weight:600;text-decoration:none}
  .utente{color:var(--testo-2);font-size:14px}
  main{max-width:1320px;margin:0 auto;padding:var(--s6)}
  .btn{font:inherit;font-weight:600;min-height:40px;padding:0 var(--s4);border-radius:var(--r-btn);border:1px solid var(--bordo-forte);background:var(--superficie);color:var(--testo);cursor:pointer}
  .btn:hover{border-color:var(--brand)}
  .btn:disabled{opacity:.45;cursor:default;border-color:var(--bordo-forte)}
  .btn-pri{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn-pri:hover{background:var(--brand-scuro)}
  .btn-sec{background:var(--pervinca-chiaro);border-color:var(--pervinca-chiaro);color:var(--pervinca-scuro)}
  :focus-visible{outline:3px solid var(--brand);outline-offset:2px}
  .card{background:var(--superficie);border:1px solid var(--bordo);border-radius:var(--r-card);box-shadow:var(--ombra-1);padding:var(--s5)}
  .stato{font-size:13px;color:var(--testo-2)}
  .stato[data-tipo=ok]{color:var(--ok-testo)} .stato[data-tipo=err]{color:var(--err-testo)}
  input,select{font:inherit;min-height:40px;padding:0 var(--s3);border:1px solid var(--bordo-forte);border-radius:var(--r-campo);background:var(--superficie);color:var(--testo)}
  /* accesso */
  .accesso{max-width:380px;margin:10vh auto;display:flex;flex-direction:column;gap:var(--s3)}
  .accesso h2{margin:0 0 var(--s2)}
  .accesso label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--testo-2)}
  .errore{color:var(--err-testo);font-size:14px;min-height:1em;margin:0}
  /* riepilogo */
  .testata{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s4)}
  .testata h2{margin:0;font-size:20px;flex:1;min-width:200px}
  .testata h2::first-letter{text-transform:uppercase}
  .riepilogo{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:var(--s3);margin-bottom:var(--s5)}
  .stat{background:var(--superficie);border:1px solid var(--bordo);border-radius:var(--r-card);padding:var(--s4)}
  .stat-t{font-size:12px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;color:var(--testo-2)}
  .stat-v{font-size:24px;font-weight:700;color:var(--brand);margin:4px 0 2px}
  .stat-s{font-size:12.5px;color:var(--testo-2)}
  /* filtri e azioni */
  .filtri{display:grid;grid-template-columns:minmax(220px,2fr) repeat(3,minmax(150px,1fr)) auto;gap:var(--s3);margin-bottom:var(--s4)}
  .azioni{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s3)}
  .azioni .info{flex:1;min-width:200px;color:var(--testo-2);font-size:14px}
  /* risultati */
  #risultati{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
  .voce{display:flex;gap:var(--s3);align-items:flex-start;background:var(--superficie);border:1px solid var(--bordo);border-left:4px solid var(--brand);border-radius:14px;padding:var(--s4);cursor:pointer;min-width:0}
  .voce:hover{box-shadow:var(--ombra-2)}
  .chk{width:20px;height:20px;min-height:0;margin-top:2px;accent-color:var(--brand);cursor:pointer;flex:none}
  .voce-corpo{flex:1;min-width:0}
  .voce-top{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
  .voce-cliente{font-size:16px;flex:1;min-width:120px;overflow-wrap:anywhere}
  .voce-data{font-weight:600;font-size:13px;color:var(--brand-scuro);background:var(--brand-chiaro);padding:2px 8px;border-radius:6px}
  .voce-riga{font-size:13.5px;color:var(--testo-2);margin-top:4px;overflow-wrap:anywhere}
  .voce-testo{color:var(--testo)}
  .badge{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
  .badge.ok{background:var(--ok-chiaro);color:var(--ok-testo)}
  .badge.att{background:var(--att-chiaro);color:var(--att-testo)}
  .badge.err{background:var(--err-chiaro);color:var(--err-testo)}
  .badge.neutro{background:var(--neutro-chiaro);color:var(--neutro-stato)}
  .vuoto{grid-column:1/-1;text-align:center;color:var(--testo-2);padding:var(--s8)}
  .vuoto .btn{margin-top:var(--s3)}
  /* dettaglio */
  dialog{border:0;border-radius:var(--r-card);padding:0;width:min(720px,calc(100vw - 32px));max-height:90vh;box-shadow:var(--ombra-3)}
  dialog::backdrop{background:rgba(23,32,51,.45)}
  .det{padding:var(--s6);overflow:auto;max-height:calc(90vh - 72px)}
  .det h2{margin:0 0 var(--s2);padding-right:40px}
  .det h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--pervinca-scuro);margin:var(--s5) 0 var(--s2)}
  .campi{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--s3);margin-top:var(--s4);padding:var(--s3);background:var(--sfondo);border-radius:12px}
  .campo-t{font-size:11px;text-transform:uppercase;font-weight:700;color:var(--testo-2)}
  .campo-v{overflow-wrap:anywhere}
  .testo{white-space:pre-wrap;margin:0}
  .nota{color:var(--testo-2);font-style:italic;margin:0}
  .materiali{list-style:none;margin:0;padding:0}
  .materiali li{display:flex;justify-content:space-between;gap:var(--s3);padding:6px 0;border-bottom:1px solid var(--bordo)}
  .det-azioni{display:flex;gap:var(--s3);justify-content:flex-end;padding:var(--s4) var(--s6);border-top:1px solid var(--bordo)}
  .chiudi{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:0;background:var(--sfondo);font-size:20px;cursor:pointer}
  @media (max-width:900px){
    .filtri{grid-template-columns:1fr 1fr}
    #risultati{grid-template-columns:1fr}
    main{padding:var(--s4)}
    .barra{padding:var(--s3) var(--s4)}
  }
</style>
</head>
<body>
<header class="barra">
  <h1>Ricerca rapportini</h1>
  <span id="utente" class="utente"></span>
  <a href="./index.html">Apri l'app</a>
  <button type="button" id="btn-esci" class="btn" hidden>Esci</button>
</header>

<main>
  <p id="stato-db" class="stato" role="status">Avvio…</p>

  <section id="schermo-accesso" hidden>
    <form id="form-accesso" class="card accesso">
      <h2>Accedi</h2>
      <label>Nome utente<input id="acc-username" autocomplete="username" required></label>
      <label>Password<input id="acc-password" type="password" autocomplete="current-password" required></label>
      <p id="acc-errore" class="errore" role="alert"></p>
      <button id="acc-invia" class="btn btn-pri">Accedi</button>
    </form>
  </section>

  <section id="schermo-negato" class="card" hidden>
    <p id="negato-testo"></p>
    <a class="btn btn-pri" href="./index.html" style="display:inline-flex;align-items:center;text-decoration:none">Apri l'app</a>
  </section>

  <section id="schermo-ricerca" hidden>
    <div class="testata">
      <h2 id="titolo-periodo"></h2>
      <label class="stato" for="filtro-mese">Mese</label>
      <input type="month" id="filtro-mese">
      <button type="button" id="btn-storico" class="btn btn-sec">Tutto lo storico</button>
      <button type="button" id="btn-aggiorna" class="btn">Aggiorna</button>
    </div>
    <div id="riepilogo" class="riepilogo"></div>

    <div class="card filtri">
      <input type="search" id="cerca-input" placeholder="Cerca cliente, indirizzo, lavoro, materiale…" aria-label="Cerca">
      <input type="date" id="cerca-data" aria-label="Giorno">
      <select id="cerca-operaio" aria-label="Operaio"><option value="">Tutti gli operai</option></select>
      <select id="cerca-stato" aria-label="Stato">
        <option value="">Tutti</option>
        <option value="completato">Rapportini completati</option>
        <option value="bozza">Rapportini in bozza</option>
        <option value="foglio">Foglio giornaliero</option>
      </select>
      <button type="button" id="btn-reset" class="btn">Azzera</button>
    </div>

    <div class="azioni">
      <span id="info-risultati" class="info"></span>
      <span id="conta-selezione" class="stato"></span>
      <button type="button" id="btn-tutti" class="btn" hidden>Seleziona tutti</button>
      <button type="button" id="btn-csv" class="btn btn-pri" disabled>Esporta materiali in Excel</button>
      <button type="button" id="btn-pdf-materiali" class="btn btn-sec" disabled>Stampa PDF materiali</button>
    </div>
    <div id="risultati"></div>
  </section>
</main>

<dialog id="dettaglio" aria-labelledby="dettaglio-titolo">
  <button type="button" id="btn-chiudi" class="chiudi" aria-label="Chiudi">&times;</button>
  <div id="dettaglio-corpo" class="det"></div>
  <div class="det-azioni">
    <button type="button" id="btn-scarica-voce" class="btn">Scarica PDF</button>
    <button type="button" id="btn-stampa-voce" class="btn btn-pri">Stampa PDF</button>
  </div>
</dialog>

<script src="./js/vendor/supabase.js"></script>
<script type="module" src="./js/modules/ricerca-computer.js"></script>
</body>
</html>
