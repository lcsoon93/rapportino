<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Interventi - Backoffice</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Libreria per generare i PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --primario: #2FA189;
    --sfondo: #F2F3F4;
    --testo: #1C1F23;
    --bordo: #C9CDD2;
    --bianco: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background-color: var(--sfondo);
    color: var(--testo);
    padding: 30px;
  }
  .container { max-width: 1000px; margin: 0 auto; }
  
  header {
    margin-bottom: 20px;
    display: flex; justify-content: space-between; align-items: center;
  }
  h1 { font-size: 24px; color: #22262B; }
  .loader { font-size: 14px; color: #5A6068; }

  /* 1. Dashboard Statistiche */
  .stats-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
  }
  .stats-header h2 { font-size: 18px; color: #5A6068; }
  .filtro-mese {
    padding: 8px 12px; font-size: 16px; border: 1.5px solid var(--primario);
    border-radius: 6px; font-family: inherit; color: var(--testo);
    background: var(--bianco); outline: none; cursor: pointer;
  }

  .stats-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;
    margin-bottom: 30px;
  }
  .stat-card {
    background: var(--bianco); padding: 20px; border-radius: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-top: 4px solid #8C97C4;
  }
  .stat-titolo { font-size: 12px; text-transform: uppercase; color: #5A6068; font-weight: 700; margin-bottom: 8px;}
  .stat-valore { font-size: 24px; font-weight: 700; color: var(--primario); }

  /* Barra di Ricerca */
  .search-box {
    display: flex; flex-wrap: wrap; gap: 10px;
    background: var(--bianco); padding: 20px; border-radius: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px;
  }
  .search-box input[type="text"], .search-box select, .search-box input[type="date"] {
    flex: 1; min-width: 150px; padding: 12px 16px; font-size: 15px;
    border: 1.5px solid var(--bordo); border-radius: 6px; font-family: inherit; color: var(--testo);
  }
  .search-box input:focus, .search-box select:focus { outline: none; border-color: var(--primario); }
  
  .btn-primario, .btn-secondario {
    padding: 12px 20px; font-size: 15px; font-weight: 600; color: var(--bianco);
    border: none; border-radius: 6px; cursor: pointer; transition: 0.2s;
  }
  .btn-primario { background-color: var(--primario); }
  .btn-primario:hover { background-color: #24826e; }
  .btn-secondario { background-color: #8C97C4; }
  .btn-secondario:hover { background-color: #717baa; }
  
  .azioni-barra { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap:10px; }
  
  /* Risultati */
  .card {
    background: var(--bianco); border-radius: 10px; padding: 20px; margin-bottom: 15px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 5px solid var(--primario);
    cursor: pointer; transition: 0.1s; position: relative;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  .card-header { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid var(--sfondo); padding-bottom: 10px; }
  .data-badge { background: #E8F5F2; color: var(--primario); padding: 4px 10px; border-radius: 4px; font-weight: 600; font-size: 13px; height: fit-content; }
  
  .cliente-nome { font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 10px;}
  
  /* Checkbox di selezione per export */
  .chk-export { width: 20px; height: 20px; accent-color: var(--primario); cursor: pointer; }

  .badge { color: white; padding: 2px 6px; border-radius: 3px; font-size: 11px; text-transform: uppercase; font-weight:600; letter-spacing: 0.5px;}
  .bg-urgente { background: #B3413A; }
  
  .cliente-indirizzo { font-size: 13px; color: #5A6068; margin-top: 4px; }
  .cliente-dettagli-prev { font-size: 13px; color: #5A6068; margin-top: 6px; font-style: italic; line-height: 1.4;}
  .nessun-risultato { text-align: center; color: #5A6068; padding: 40px; font-size: 16px; }

  /* Finestra Modale */
  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center;
    padding: 20px; backdrop-filter: blur(3px);
  }
  .modal-content {
    background: var(--bianco); padding: 30px; border-radius: 12px;
    max-width: 650px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative;
  }
  .modal-close {
    position: absolute; top: 20px; right: 20px; background: #F2F3F4; color: #5A6068;
    border: none; border-radius: 50%; width: 32px; height: 32px;
    font-size: 18px; cursor: pointer;
  }
  .modal-azioni { display: flex; gap: 10px; margin-top: 20px; border-top: 1px solid var(--sfondo); padding-top: 20px; }
  
  .riga-dati { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 15px; padding: 12px; background: #FAFAFA; border-radius: 8px; border: 1px solid #E8EAED;}
  .dato-box { flex: 1; min-width: 120px; }
  .dato-etichetta { font-size: 11px; text-transform: uppercase; color: #8C97C4; font-weight: 700; margin-bottom: 4px; }
  .dato-valore { font-size: 15px; font-weight: 500; }
  
  .sezione { margin-bottom: 15px; }
  .sezione-titolo { font-size: 12px; text-transform: uppercase; font-weight: 700; color: #8C97C4; margin-bottom: 5px; }
  .materiale-lista { list-style-type: none; }
  .materiale-lista li { font-size: 14px; padding: 4px 0; border-bottom: 1px solid #f0f0f0; }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Dashboard Operativa</h1>
    <div id="stato-db" class="loader">In attesa di connessione...</div>
  </header>

  <!-- Selettore Mese per le Statistiche -->
  <div class="stats-header">
    <h2>Riepilogo Mese</h2>
    <input type="month" id="filtro-mese" class="filtro-mese" onchange="cambioMese()">
  </div>

  <!-- Dashboard mensile -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-titolo">Interventi (Mese)</div>
      <div class="stat-valore" id="stat-interventi">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-titolo">Ore Lavorate (Mese)</div>
      <div class="stat-valore" id="stat-ore">0h 0m</div>
    </div>
    <div class="stat-card">
      <div class="stat-titolo">Spese Anticipate (Mese)</div>
      <div class="stat-valore" id="stat-spese">€ 0,00</div>
    </div>
  </div>

  <!-- Barra Ricerca e Filtri -->
  <div class="search-box">
    <input type="text" id="cerca-input" placeholder="Cerca cliente, indirizzo, dettaglio..." onkeyup="seInvio(event)">
    <input type="date" id="cerca-data" title="Giorno esatto (Ignora il mese sopra)">
    <select id="cerca-tecnico">
      <option value="">Tutti i tecnici</option>
    </select>
    <button class="btn-primario" onclick="eseguiRicerca()">Cerca</button>
    <button class="btn-secondario" onclick="pulisciRicerca()">Reset Filtri</button>
  </div>

  <div class="azioni-barra">
    <div id="info-risultati" style="color: #5A6068; font-size: 14px;"></div>
    <div style="display:flex; gap: 10px;">
      <button id="btn-select-all" class="btn-secondario" style="display:none;" onclick="toggleSelezionaTutti()">Seleziona Tutti</button>
      <button id="btn-export" class="btn-primario" style="display:none; background-color: #8C97C4;" onclick="esportaMaterialiPDF()">Esporta Materiali (PDF)</button>
    </div>
  </div>

  <div id="risultati"></div>
</div>

<!-- Modale Dettaglio -->
<div id="modal-overlay" class="modal-overlay" onclick="chiudiSeFuori(event)">
  <div class="modal-content">
    <button class="modal-close" onclick="chiudiModale()">&times;</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
// ==========================================
// 1. INSERISCI QUI I DATI DI SUPABASE
// ==========================================
const SUPABASE_URL = "https://kdzgtvnimqvxfweomxdo.supabase.co"; 
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtkemd0dm5pbXF2eGZ3ZW9teGRvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0OTg3NzgsImV4cCI6MjEwNTA3NDc3OH0.bXPzy48u_NVmQ6AO5Z0hBRQpirR_6cDt8eUf6fPHXr8"; 

let archivioCompleto = [];
let risultatiCorrenti = [];
let statoSelezioneTutti = false;

// Funzioni di utilità
function formattaData(iso) { const p = iso.split("-"); return `${p[2]}/${p[1]}/${p[0]}`; }
function euro(n) { return "€ " + parseFloat(n).toFixed(2).replace('.', ','); }

// Calcolo Ore
function toMin(t) { const p = t.split(":"); return +p[0]*60 + +p[1]; }
function minutiGiornata(dalle, alle) {
  if(!dalle || !alle) return 0;
  let m = toMin(alle) - toMin(dalle);
  if(m < 0) m += 24*60;
  return m;
}
function oreTesto(min) {
  const h = Math.floor(min/60), m = min%60;
  return h + "h " + m + "m";
}

// ------------------------------------------
// INIZIALIZZAZIONE E CARICAMENTO
// ------------------------------------------
async function caricaDati() {
  const statoDb = document.getElementById('stato-db');
  
  const oggi = new Date();
  const meseCorrenteISO = oggi.toISOString().slice(0, 7);
  document.getElementById("filtro-mese").value = meseCorrenteISO;

  if (!SUPABASE_URL || SUPABASE_URL === "INSERISCI_URL_QUI") {
    statoDb.innerHTML = "⚠️ Configura URL e KEY di Supabase"; statoDb.style.color = "#B3413A"; return;
  }
  statoDb.innerHTML = "Sincronizzazione in corso...";
  
  try {
    const risposta = await fetch(SUPABASE_URL + "/rest/v1/rapporti?select=data,dati", {
      headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
    });
    if (!risposta.ok) throw new Error("Errore di rete");
    
    archivioCompleto = await risposta.json();
    archivioCompleto.sort((a, b) => b.data.localeCompare(a.data)); // Ordina dal più recente
    
    statoDb.innerHTML = `✓ Connesso (${archivioCompleto.length} giornate)`;
    statoDb.style.color = "var(--primario)";
    
    popolaFiltriEstrazioni();
    calcolaStatisticheMese();
    eseguiRicerca(); 
    
  } catch(e) {
    console.error(e);
    statoDb.innerHTML = "❌ Errore di connessione al database";
    statoDb.style.color = "#B3413A";
  }
}

function popolaFiltriEstrazioni() {
  const selectTecnici = document.getElementById("cerca-tecnico");
  const tecniciSet = new Set();
  
  archivioCompleto.forEach(r => {
    if (r.dati && r.dati.tecnici) tecniciSet.add(r.dati.tecnici.trim());
  });
  
  tecniciSet.forEach(t => {
    const opt = document.createElement("option");
    opt.value = t; opt.textContent = t;
    selectTecnici.appendChild(opt);
  });
}

// ------------------------------------------
// GESTIONE MESE E STATISTICHE
// ------------------------------------------
function cambioMese() {
  calcolaStatisticheMese();
  eseguiRicerca();
}

function calcolaStatisticheMese() {
  const meseSelezionato = document.getElementById("filtro-mese").value; // Es: "2026-09"
  let totInterventi = 0;
  let totSpese = 0;
  
  // Calcolo ore con limite di 9h (540 min)
  let totBase = 0;
  let totExtra = 0;
  const limiteGiornaliero = 9 * 60; 

  archivioCompleto.forEach(r => {
    if (r.data.startsWith(meseSelezionato) && r.dati) {
      
      const pausa = (r.dati.pausa !== undefined) ? +r.dati.pausa : 60;
      const viaggio = +r.dati.viaggio || 0;
      const netto = Math.max(0, minutiGiornata(r.dati.dalle, r.dati.alle) - pausa - viaggio);
      
      if (netto > 0) {
        // Separa le ore in "fino a 9" e "eccedenza oltre le 9"
        const extra = Math.max(0, netto - limiteGiornaliero);
        const base = netto - extra;
        
        totBase += base;
        totExtra += extra;
      }

      if (r.dati.spese) {
        r.dati.spese.forEach(s => totSpese += (+s.i || 0));
      }

      if (r.dati.clienti) {
        totInterventi += r.dati.clienti.length;
      }
    }
  });

  document.getElementById("stat-interventi").textContent = totInterventi;
  document.getElementById("stat-spese").textContent = euro(totSpese);
  
  // Formatta le ore: "TotaleBase +TotaleExtra"
  let testoOre = oreTesto(totBase);
  if (totExtra > 0) {
    testoOre += "  +" + oreTesto(totExtra);
  }
  document.getElementById("stat-ore").textContent = testoOre;
}

// ------------------------------------------
// RICERCA E VISUALIZZAZIONE
// ------------------------------------------
function seInvio(event) { if (event.key === "Enter") eseguiRicerca(); }

function pulisciRicerca() {
  document.getElementById("cerca-input").value = "";
  document.getElementById("cerca-data").value = "";
  document.getElementById("cerca-tecnico").value = "";
  eseguiRicerca();
}

function eseguiRicerca() {
  const query = document.getElementById("cerca-input").value.trim().toLowerCase();
  const dataQuery = document.getElementById("cerca-data").value; 
  const tecnicoQuery = document.getElementById("cerca-tecnico").value;
  const meseQuery = document.getElementById("filtro-mese").value;
  
  const contenitore = document.getElementById("risultati");
  contenitore.innerHTML = "";
  document.getElementById("info-risultati").innerHTML = "";
  
  // Resetta pulsanti e selezioni
  document.getElementById("btn-export").style.display = "none";
  document.getElementById("btn-select-all").style.display = "none";
  statoSelezioneTutti = false;
  document.getElementById("btn-select-all").textContent = "Seleziona Tutti";
  
  risultatiCorrenti = [];

  archivioCompleto.forEach((record, idxGiornata) => {
    const dataIso = record.data;
    const dati = record.dati;
    if (!dati || !dati.clienti) return;

    if (dataQuery && dataIso !== dataQuery) return;
    if (!dataQuery && !dataIso.startsWith(meseQuery)) return;
    if (tecnicoQuery && dati.tecnici !== tecnicoQuery) return;

    dati.clienti.forEach((cliente, idxCliente) => {
      if (query.length >= 2) {
        const trovato = (cliente.nome && cliente.nome.toLowerCase().includes(query)) ||
                        (cliente.indirizzo && cliente.indirizzo.toLowerCase().includes(query)) ||
                        (cliente.dettagli && cliente.dettagli.toLowerCase().includes(query));
        if(!trovato) return;
      }
      
      risultatiCorrenti.push({
        dataIso, datiGiorno: dati, cliente, idxGiornata, idxCliente
      });
    });
  });

  if (risultatiCorrenti.length === 0) {
    contenitore.innerHTML = `<div class="nessun-risultato">Nessun intervento trovato per i filtri e il mese selezionato.</div>`;
  } else {
    document.getElementById("info-risultati").innerHTML = `Trovati ${risultatiCorrenti.length} interventi.`;
    document.getElementById("btn-export").style.display = "block";
    document.getElementById("btn-select-all").style.display = "block";

    risultatiCorrenti.forEach((item, index) => {
      const c = item.cliente;
      const card = document.createElement('div');
      card.className = 'card';
      card.setAttribute('onclick', `apriModale(${index})`);
      
      let badgeHtml = c.urgente ? '<span class="badge bg-urgente">Urgente</span> ' : '';
      
      let shortDesc = "";
      if (c.dettagli) {
        shortDesc = c.dettagli.length > 90 ? c.dettagli.substring(0, 90) + "..." : c.dettagli;
      }

      card.innerHTML = `
        <div class="card-header">
          <div class="cliente-nome">
            <input type="checkbox" class="chk-export" value="${index}" title="Seleziona per esportare materiali" onclick="event.stopPropagation()"> 
            ${c.nome || "(Senza nome)"} ${badgeHtml}
          </div>
          <div class="data-badge">${formattaData(item.dataIso)}</div>
        </div>
        ${c.indirizzo ? `<div class="cliente-indirizzo" style="margin-left:30px;">📍 ${c.indirizzo}</div>` : ''}
        ${shortDesc ? `<div class="cliente-dettagli-prev" style="margin-left:30px;">📝 ${shortDesc}</div>` : ''}
      `;
      contenitore.appendChild(card);
    });
  }
}

// ------------------------------------------
// SELEZIONA TUTTI I CHECKBOX
// ------------------------------------------
function toggleSelezionaTutti() {
  const checkboxes = document.querySelectorAll('.chk-export');
  statoSelezioneTutti = !statoSelezioneTutti;
  
  checkboxes.forEach(chk => {
    chk.checked = statoSelezioneTutti;
  });
  
  const btn = document.getElementById('btn-select-all');
  btn.textContent = statoSelezioneTutti ? "Deseleziona Tutti" : "Seleziona Tutti";
}

// ------------------------------------------
// MODALE
// ------------------------------------------
function apriModale(index) {
  const item = risultatiCorrenti[index];
  const c = item.cliente;
  const body = document.getElementById("modal-body");
  
  let html = `
    <h2 style="margin-bottom: 5px; display: flex; align-items: center; gap: 10px;">
      ${c.nome || "Senza nome"} 
      ${c.urgente ? '<span class="badge bg-urgente" style="font-size:12px; padding:3px 8px;">Urgente</span>' : ''}
    </h2>
    <div style="color:#5A6068; margin-bottom:20px; font-size:14px;">📍 ${c.indirizzo || "Indirizzo mancante"}</div>
    
    <div class="riga-dati">
      <div class="dato-box"><div class="dato-etichetta">Data</div><div class="dato-valore">${formattaData(item.dataIso)}</div></div>
      <div class="dato-box"><div class="dato-etichetta">Tecnici</div><div class="dato-valore">${item.datiGiorno.tecnici || "Non specificati"}</div></div>
      ${c.importo ? `<div class="dato-box"><div class="dato-etichetta">Da Fatturare</div><div class="dato-valore" style="font-weight:700;">${euro(c.importo)}</div></div>` : ''}
    </div>
    
    <div class="sezione"><div class="sezione-titolo">Lavoro Eseguito</div><div style="white-space: pre-wrap; font-size: 14px;">${c.dettagli || "-"}</div></div>
  `;

  if (c.materiali && c.materiali.length > 0) {
    html += `<div class="sezione"><div class="sezione-titolo">Materiale Utilizzato</div><ul class="materiale-lista">
             ${c.materiali.map(m => `<li>${m.a} <span style="float:right; color:#5A6068;">${m.q || ''}</span></li>`).join('')}
             </ul></div>`;
  }

  html += `
    <div class="modal-azioni">
      <button class="btn-primario" onclick="generaPDFIntervento(${index})">Scarica PDF Intervento</button>
    </div>
  `;

  body.innerHTML = html;
  document.getElementById("modal-overlay").style.display = "flex";
}

function chiudiModale() { document.getElementById("modal-overlay").style.display = "none"; }
function chiudiSeFuori(event) { if (event.target.id === 'modal-overlay') chiudiModale(); }


// PDF Singolo Intervento
function generaPDFIntervento(index) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"mm", format:"a4"});
  const item = risultatiCorrenti[index];
  const c = item.cliente;
  let y = 20;

  doc.setFont("helvetica","bold"); doc.setFontSize(14);
  doc.text("SCHEDA INTERVENTO", 105, y, {align: "center"});
  y += 15;

  doc.setFontSize(11); doc.setFont("helvetica","normal");
  doc.text(`Data: ${formattaData(item.dataIso)}`, 20, y);
  doc.text(`Tecnici: ${item.datiGiorno.tecnici || "-"}`, 120, y);
  y += 10;
  
  doc.setFont("helvetica","bold");
  doc.text(`Cliente: ${c.nome || "Senza nome"}`, 20, y);
  doc.setFont("helvetica","normal");
  y += 6;
  if(c.indirizzo) { doc.text(`Indirizzo: ${c.indirizzo}`, 20, y); y += 6; }
  
  y += 5;
  doc.setFont("helvetica","bold"); doc.text("Lavoro Eseguito:", 20, y); y += 6;
  doc.setFont("helvetica","normal");
  if(c.dettagli) {
    const righe = doc.splitTextToSize(c.dettagli, 170);
    doc.text(righe, 20, y);
    y += righe.length * 5 + 5;
  } else { doc.text("-", 20, y); y += 10; }

  if(c.materiali && c.materiali.length > 0) {
    doc.setFont("helvetica","bold"); doc.text("Materiale Utilizzato:", 20, y); y += 6;
    doc.setFont("helvetica","normal");
    c.materiali.forEach(m => {
      doc.text(`- ${m.a} ${m.q ? '('+m.q+')' : ''}`, 25, y);
      y += 5;
    });
  }
  
  doc.save(`Intervento_${(c.nome || 'Cliente').replace(/\s+/g,'_')}_${item.dataIso}.pdf`);
}

// ------------------------------------------
// ESPORTA MATERIALI SELEZIONATI (PDF)
// ------------------------------------------
function esportaMaterialiPDF() {
  const checkboxes = document.querySelectorAll('.chk-export:checked');
  
  if (checkboxes.length === 0) {
    alert("Seleziona almeno un intervento spuntando le caselline a fianco del nome cliente.");
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"mm", format:"a4"});
  let y = 20;

  doc.setFont("helvetica", "bold");
  doc.setFontSize(14);
  doc.text("REPORT MATERIALI SELEZIONATI", 105, y, {align: "center"});
  y += 15;

  checkboxes.forEach(chk => {
    const idx = chk.value;
    const item = risultatiCorrenti[idx];
    const c = item.cliente;

    doc.setFontSize(11);
    doc.setFont("helvetica", "bold");
    doc.text(`${formattaData(item.dataIso)} - ${c.nome || "Senza Nome"}`, 20, y);
    y += 6;

    doc.setFont("helvetica", "normal");
    if (c.materiali && c.materiali.length > 0) {
      c.materiali.forEach(m => {
        doc.text(`- ${m.a} ${m.q ? '('+m.q+')' : ''}`, 25, y);
        y += 5;
        if (y > 270) { doc.addPage(); y = 20; }
      });
    } else {
      doc.setFont("helvetica", "italic");
      doc.text("Nessun materiale segnato", 25, y);
      doc.setFont("helvetica", "normal");
      y += 5;
    }
    
    y += 5;
    if (y > 270) { doc.addPage(); y = 20; }
  });

  const mese = document.getElementById("filtro-mese").value;
  doc.save(`Materiali_${mese}.pdf`);
}

// Avvia
caricaDati();
</script>
</body>
</html>
