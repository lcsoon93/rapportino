<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ricerca Interventi - Backoffice</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primario: #2FA189;
    --sfondo: #F2F3F4;
    --testo: #1C1F23;
    --bordo: #C9CDD2;
    --bianco: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background-color: var(--sfondo);
    color: var(--testo);
    padding: 30px;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
  }
  header {
    margin-bottom: 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  h1 { font-size: 24px; color: #22262B; }
  
  /* Nuova impostazione per la barra di ricerca */
  .search-box {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    background: var(--bianco);
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    margin-bottom: 20px;
  }
  .search-box input[type="text"] {
    flex: 2;
    min-width: 250px;
    padding: 12px 16px;
    font-size: 16px;
    border: 1.5px solid var(--bordo);
    border-radius: 6px;
    font-family: inherit;
  }
  .search-box input[type="date"] {
    flex: 1;
    min-width: 150px;
    padding: 12px 16px;
    font-size: 16px;
    border: 1.5px solid var(--bordo);
    border-radius: 6px;
    font-family: inherit;
    color: var(--testo);
  }
  .search-box input:focus {
    outline: none;
    border-color: var(--primario);
  }
  .btn-primario, .btn-secondario {
    padding: 12px 24px;
    font-size: 16px;
    font-weight: 600;
    color: var(--bianco);
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.2s;
  }
  .btn-primario { background-color: var(--primario); }
  .btn-primario:hover { background-color: #24826e; }
  .btn-secondario { background-color: #8C97C4; }
  .btn-secondario:hover { background-color: #717baa; }
  
  .azioni-barra {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .btn-export {
    background-color: #8C97C4;
    display: none;
  }
  .btn-export:hover { background-color: #717baa; }
  
  .loader { font-size: 14px; color: #5A6068; }
  
  /* Risultati */
  .card {
    background: var(--bianco);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    border-left: 5px solid var(--primario);
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 15px;
    border-bottom: 1px solid var(--sfondo);
    padding-bottom: 10px;
  }
  .data-badge {
    background: #E8F5F2;
    color: var(--primario);
    padding: 4px 10px;
    border-radius: 4px;
    font-weight: 600;
    font-size: 14px;
    height: fit-content;
  }
  .cliente-nome { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px;}
  .urgente-badge { background: #B3413A; color: white; padding: 2px 6px; border-radius: 3px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;}
  .cliente-indirizzo { font-size: 14px; color: #5A6068; margin-top: 4px; }
  
  .sezione { margin-bottom: 15px; }
  .sezione:last-child { margin-bottom: 0; }
  .sezione-titolo {
    font-size: 12px;
    text-transform: uppercase;
    font-weight: 700;
    color: #8C97C4;
    letter-spacing: 1px;
    margin-bottom: 5px;
  }
  .dettagli-testo { white-space: pre-wrap; font-size: 15px; line-height: 1.5; }
  .materiale-lista { list-style-type: none; }
  .materiale-lista li {
    font-size: 15px;
    padding: 4px 0;
    border-bottom: 1px solid #f0f0f0;
  }
  .materiale-lista li:last-child { border-bottom: none; }
  .qta { color: #5A6068; font-size: 14px; }
  
  .nessun-risultato { text-align: center; color: #5A6068; padding: 40px; font-size: 16px; }

  /* Finestra Modale */
  .modal-overlay {
    display: none;
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    align-items: center; justify-content: center;
    padding: 20px;
    backdrop-filter: blur(3px);
  }
  .modal-content {
    background: var(--bianco);
    padding: 30px;
    border-radius: 12px;
    max-width: 650px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  }
  .modal-close {
    position: absolute; top: 20px; right: 20px;
    background: #F2F3F4; color: #5A6068;
    border: none; border-radius: 50%;
    width: 32px; height: 32px;
    font-size: 18px; line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { background: #E8EAED; }
  .riga-dati { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 15px; padding: 12px; background: #FAFAFA; border-radius: 8px; border: 1px solid #E8EAED;}
  .dato-box { flex: 1; min-width: 120px; }
  .dato-etichetta { font-size: 11px; text-transform: uppercase; color: #8C97C4; font-weight: 700; margin-bottom: 4px; }
  .dato-valore { font-size: 15px; font-weight: 500; }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Archivio Interventi</h1>
    <div id="stato-db" class="loader">In attesa di connessione...</div>
  </header>

  <div class="search-box">
    <input type="text" id="cerca-input" placeholder="Cerca nome cliente, luogo o indirizzo..." onkeyup="seInvio(event)">
    <input type="date" id="cerca-data" title="Cerca per data precisa" onchange="eseguiRicerca()">
    <button class="btn-primario" onclick="eseguiRicerca()">Cerca</button>
    <button class="btn-secondario" onclick="pulisciRicerca()">Reset</button>
  </div>

  <div class="azioni-barra">
    <div id="info-risultati" style="color: #5A6068; font-size: 14px;"></div>
    <button id="btn-export" class="btn-primario btn-export" onclick="esportaCSV()">Esporta Materiali (CSV)</button>
  </div>

  <div id="risultati">
    <!-- I risultati appariranno qui -->
  </div>
</div>

<!-- Struttura della Finestra Modale -->
<div id="modal-overlay" class="modal-overlay" onclick="chiudiSeFuori(event)">
  <div class="modal-content">
    <button class="modal-close" onclick="chiudiModale()">&times;</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
// ==========================================
// 1. INSERISCI QUI I DATI DI SUPABASE
// ==========================================
const SUPABASE_URL = "https://kdzgtvnimqvxfweomxdo.supabase.co"; 
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtkemd0dm5pbXF2eGZ3ZW9teGRvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0OTg3NzgsImV4cCI6MjEwNTA3NDc3OH0.bXPzy48u_NVmQ6AO5Z0hBRQpirR_6cDt8eUf6fPHXr8"; 

let archivioCompleto = [];
let risultatiCorrenti = [];

function formattaData(iso) {
  const p = iso.split("-");
  return `${p[2]}/${p[1]}/${p[0]}`;
}

async function caricaDati() {
  const statoDb = document.getElementById('stato-db');
  
  if (!SUPABASE_URL || SUPABASE_URL === "INSERISCI_URL_QUI") {
    statoDb.innerHTML = "⚠️ Configura URL e KEY di Supabase nel codice";
    statoDb.style.color = "#B3413A";
    return;
  }

  statoDb.innerHTML = "Sincronizzazione in corso...";
  
  try {
    const risposta = await fetch(SUPABASE_URL + "/rest/v1/rapporti?select=data,dati", {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    });
    
    if (!risposta.ok) throw new Error("Errore di rete");
    
    archivioCompleto = await risposta.json();
    archivioCompleto.sort((a, b) => b.data.localeCompare(a.data));
    
    statoDb.innerHTML = `✓ Connesso (${archivioCompleto.length} giornate)`;
    statoDb.style.color = "var(--primario)";
    
  } catch(e) {
    console.error(e);
    statoDb.innerHTML = "❌ Errore di connessione al database";
    statoDb.style.color = "#B3413A";
  }
}

function seInvio(event) {
  if (event.key === "Enter") eseguiRicerca();
}

function pulisciRicerca() {
  document.getElementById("cerca-input").value = "";
  document.getElementById("cerca-data").value = "";
  document.getElementById("risultati").innerHTML = "";
  document.getElementById("info-risultati").innerHTML = "";
  document.getElementById("btn-export").style.display = "none";
  risultatiCorrenti = [];
}

// Funzione principale di ricerca aggiornata (Testo + Data)
function eseguiRicerca() {
  const query = document.getElementById("cerca-input").value.trim().toLowerCase();
  const dataQuery = document.getElementById("cerca-data").value; // Formato YYYY-MM-DD
  const contenitore = document.getElementById("risultati");
  const infoRisultati = document.getElementById("info-risultati");
  const btnExport = document.getElementById("btn-export");
  
  contenitore.innerHTML = "";
  infoRisultati.innerHTML = "";
  btnExport.style.display = "none";
  risultatiCorrenti = [];

  // Se non si scrive almeno 2 lettere E non si seleziona una data, blocca la ricerca
  if (query.length < 2 && !dataQuery) {
    contenitore.innerHTML = '<div class="nessun-risultato">Inserisci un testo o seleziona una data per cercare.</div>';
    return;
  }

  archivioCompleto.forEach(record => {
    const dataIso = record.data;
    const datiGiorno = record.dati;
    
    if (!datiGiorno || !datiGiorno.clienti) return;

    // 1. FILTRO DATA: se l'utente ha scelto una data e questa non coincide, salto al prossimo record
    if (dataQuery && dataIso !== dataQuery) return;

    // 2. FILTRO TESTO: se supero il filtro data, cerco i clienti
    const clientiTrovati = datiGiorno.clienti.filter(c => {
      // Se l'utente ha scritto qualcosa, filtro i clienti in base al testo
      if (query.length >= 2) {
        return (c.nome && c.nome.toLowerCase().includes(query)) ||
               (c.indirizzo && c.indirizzo.toLowerCase().includes(query)) ||
               (c.dettagli && c.dettagli.toLowerCase().includes(query));
      }
      // Se non ha scritto nulla (es. sta cercando SOLO per data), prendo tutti i clienti di quel giorno
      return true; 
    });

    clientiTrovati.forEach(cliente => {
      risultatiCorrenti.push({
        dataIso: dataIso,
        datiGiorno: datiGiorno,
        cliente: cliente
      });
    });
  });

  // Stampa a video
  if (risultatiCorrenti.length === 0) {
    contenitore.innerHTML = `<div class="nessun-risultato">Nessun intervento trovato per i filtri selezionati.</div>`;
  } else {
    let testoRicerca = "";
    if (dataQuery && query) testoRicerca = ` per "<b>${query}</b>" del <b>${formattaData(dataQuery)}</b>`;
    else if (dataQuery) testoRicerca = ` del <b>${formattaData(dataQuery)}</b>`;
    else if (query) testoRicerca = ` per "<b>${query}</b>"`;

    infoRisultati.innerHTML = `Trovati ${risultatiCorrenti.length} intervent${risultatiCorrenti.length === 1 ? 'o' : 'i'}${testoRicerca}. Clicca su una scheda per i dettagli.`;
    btnExport.style.display = "block";

    risultatiCorrenti.forEach((item, index) => {
      const c = item.cliente;
      const card = document.createElement('div');
      card.className = 'card';
      card.setAttribute('onclick', `apriModale(${index})`);
      
      let html = `
        <div class="card-header">
          <div>
            <div class="cliente-nome">
              ${c.nome || "(Senza nome)"}
              ${c.urgente ? '<span class="urgente-badge">Urgente</span>' : ''}
            </div>
            ${c.indirizzo ? `<div class="cliente-indirizzo">📍 ${c.indirizzo}</div>` : ''}
          </div>
          <div class="data-badge">${formattaData(item.dataIso)}</div>
        </div>
      `;

      if (c.dettagli) {
        html += `<div class="sezione"><div class="sezione-titolo">Intervento Eseguito</div><div class="dettagli-testo">${c.dettagli}</div></div>`;
      }
      if (c.materiali && c.materiali.length > 0) {
        const anteprimaMat = c.materiali.slice(0, 3).map(m => `<li>${m.a} ${m.q ? `<span class="qta">(${m.q})</span>` : ''}</li>`).join('');
        const extraMat = c.materiali.length > 3 ? `<li style="color:#8C97C4; font-size:13px; font-weight:600;">+ altri ${c.materiali.length - 3} articoli...</li>` : '';
        html += `<div class="sezione"><div class="sezione-titolo">Materiale Utilizzato</div><ul class="materiale-lista">${anteprimaMat}${extraMat}</ul></div>`;
      }

      card.innerHTML = html;
      contenitore.appendChild(card);
    });
  }
}

// Funzioni Modale
function apriModale(index) {
  const item = risultatiCorrenti[index];
  const c = item.cliente;
  const body = document.getElementById("modal-body");
  
  const fasce = c.fasce && c.fasce.length ? c.fasce : ((c.dalle || c.alle) ? [{d: c.dalle, a: c.alle}] : []);
  const testoOrari = fasce.map(f => (f.d && f.a ? `${f.d} - ${f.a}` : f.d || f.a || "")).filter(Boolean).join(" / ") || "Non specificato";

  let html = `
    <h2 style="margin-bottom: 5px; display:flex; align-items:center; gap:10px;">
      ${c.nome || "Cliente senza nome"}
      ${c.urgente ? '<span class="urgente-badge" style="font-size:12px; padding:3px 8px;">Urgente</span>' : ''}
    </h2>
    <div style="color:#5A6068; margin-bottom:20px; font-size:15px;">📍 ${c.indirizzo || "Indirizzo non specificato"}</div>
    
    <div class="riga-dati">
      <div class="dato-box">
        <div class="dato-etichetta">Data Intervento</div>
        <div class="dato-valore">${formattaData(item.dataIso)}</div>
      </div>
      <div class="dato-box">
        <div class="dato-etichetta">Tecnici Incaricati</div>
        <div class="dato-valore">${item.datiGiorno.tecnici || "Non specificati"}</div>
      </div>
      <div class="dato-box">
        <div class="dato-etichetta">Orario Cliente</div>
        <div class="dato-valore">⏱ ${testoOrari}</div>
      </div>
    </div>

    <div class="riga-dati">
      <div class="dato-box">
        <div class="dato-etichetta">Tipologia</div>
        <div class="dato-valore">${c.tipologia || "—"}</div>
      </div>
      <div class="dato-box">
        <div class="dato-etichetta">Stato Lavoro</div>
        <div class="dato-valore" style="color: ${c.stato === 'Da ultimare' ? '#B3413A' : '#2FA189'}; font-weight:600;">
          ${c.stato || "Completato"}
        </div>
      </div>
      ${c.importo ? `
      <div class="dato-box">
        <div class="dato-etichetta">Da Fatturare</div>
        <div class="dato-valore" style="font-weight:700;">€ ${parseFloat(c.importo).toFixed(2).replace('.', ',')}</div>
      </div>` : ''}
    </div>
  `;

  if (c.fatturare) {
    html += `<div style="margin-bottom: 15px; font-size: 14px;"><b>Riferimento / Fatturare a:</b> ${c.fatturare}</div>`;
  }

  html += `
    <hr style="border: 0; border-top: 1px solid #E8EAED; margin: 20px 0;">
    <div class="sezione">
      <div class="sezione-titolo">Dettaglio Intervento</div>
      <div class="dettagli-testo">${c.dettagli || "Nessun dettaglio inserito."}</div>
    </div>
  `;

  if (c.materiali && c.materiali.length > 0) {
    html += `
      <hr style="border: 0; border-top: 1px solid #E8EAED; margin: 20px 0;">
      <div class="sezione">
        <div class="sezione-titolo">Materiale Utilizzato (${c.materiali.length} voci)</div>
        <ul class="materiale-lista">
          ${c.materiali.map(m => `<li>${m.a} ${m.q ? `<span class="qta" style="float:right;">Qtà: <b>${m.q}</b></span>` : ''}</li>`).join('')}
        </ul>
      </div>
    `;
  }

  if (c.firmatario || c.firma) {
    html += `
      <hr style="border: 0; border-top: 1px solid #E8EAED; margin: 20px 0;">
      <div class="sezione">
        <div class="sezione-titolo">Firma</div>
        <div style="font-size:14px; margin-bottom:5px;">Firmato da: <b>${c.firmatario || "Cliente"}</b></div>
        ${c.firma ? '<div style="font-size:13px; color:#5A6068;"><i>[La firma grafica è visibile nel PDF originale]</i></div>' : ''}
      </div>
    `;
  }

  body.innerHTML = html;
  document.getElementById("modal-overlay").style.display = "flex";
  document.body.style.overflow = "hidden";
}

function chiudiModale() {
  document.getElementById("modal-overlay").style.display = "none";
  document.body.style.overflow = "auto";
}

function chiudiSeFuori(event) {
  if (event.target.id === 'modal-overlay') chiudiModale();
}

// Esportazione CSV
function esportaCSV() {
  if (risultatiCorrenti.length === 0) return;
  let csvContent = "Data,Tecnici,Cliente,Indirizzo,Articolo,Quantita\n";
  const formattaCSV = (testo) => {
    if (!testo) return '""';
    let pulito = testo.toString().replace(/"/g, '""'); 
    return `"${pulito}"`;
  };

  risultatiCorrenti.forEach(item => {
    const dataFormatted = formattaData(item.dataIso);
    const tecnici = formattaCSV(item.datiGiorno.tecnici || "");
    const cliente = formattaCSV(item.cliente.nome || "");
    const indirizzo = formattaCSV(item.cliente.indirizzo || "");
    
    if (item.cliente.materiali && item.cliente.materiali.length > 0) {
      item.cliente.materiali.forEach(mat => {
        csvContent += `${dataFormatted},${tecnici},${cliente},${indirizzo},${formattaCSV(mat.a)},${formattaCSV(mat.q || "")}\n`;
      });
    } else {
      csvContent += `${dataFormatted},${tecnici},${cliente},${indirizzo},"", ""\n`;
    }
  });

  const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  
  let nomeFile = "Esportazione_Materiali";
  const query = document.getElementById("cerca-input").value.trim().replace(/\s+/g, '_');
  const queryData = document.getElementById("cerca-data").value;
  if (queryData) nomeFile += `_${queryData}`;
  if (query) nomeFile += `_${query}`;
  
  link.setAttribute("href", url);
  link.setAttribute("download", `${nomeFile}.csv`);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// Avvia
caricaDati();

</script>
</body>
</html>
