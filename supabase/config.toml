# Configurazione Supabase CLI per Rapportino (solo cio' che differisce dai valori predefiniti).
project_id = "rapportino"

[auth]
# niente registrazione pubblica: gli account li crea l'amministratore (Edge Function "utenti")
enable_signup = false
enable_anonymous_sign_ins = false

# login e inizializzazione si chiamano senza sessione: il controllo lo fanno le funzioni
[functions.accesso]
verify_jwt = false

[functions.inizializza]
verify_jwt = false

[functions.utenti]
verify_jwt = true

[functions.cambia-password]
verify_jwt = true

# PIN di accesso: solo con una sessione (si imposta/cambia/rimuove il proprio PIN)
[functions.pin]
verify_jwt = true

# notifiche push: solo con una sessione (svuota la coda scritta dal database)
[functions.notifiche]
verify_jwt = true

# assistente AI (Groq): solo con una sessione; i dati li legge con il token dell'utente (RLS)
[functions.ai]
verify_jwt = true
