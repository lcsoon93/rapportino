<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rapporto di lavoro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --quadro:#22262B;
    --modulo:#F2F3F4;
    --testo:#1C1F23;
    --fase:#8C5A2B;
    --neutro:#1F5FA8;
    --terra1:#F7D417;
    --terra2:#3E9B3E;
    --rame:#C97B3D;
    --bordo:#C9CDD2;
    --spento:#5A6068;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--quadro);
    color:var(--testo);
    font-family:'IBM Plex Sans',sans-serif;
    font-size:16px;
    padding-bottom:160px;
  }
  .colonna{max-width:560px;margin:0 auto;padding:0 14px}

  header{
    padding:22px 2px 14px;
    color:#E8EAED;
    display:flex;align-items:center;gap:14px;
  }
  .fulmine{
    flex:none;width:46px;height:46px;
    border:2px solid var(--terra1);
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
  }
  .fulmine svg{width:24px;height:24px;fill:var(--terra1)}
  header h1{
    font-family:'Chakra Petch',sans-serif;
    font-weight:700;font-size:23px;
    text-transform:uppercase;letter-spacing:1px;line-height:1.1;
  }
  .terra{
    height:8px;border-radius:4px;
    margin:2px 2px 18px;
    background:repeating-linear-gradient(90deg,var(--terra1) 0 26px,var(--terra2) 26px 52px);
  }

  .modulo{
    background:var(--modulo);
    border-radius:10px;
    padding:16px 16px 18px 20px;
    margin-bottom:14px;
    position:relative;
    box-shadow:0 2px 0 rgba(0,0,0,.35);
  }
  .modulo::before{
    content:"";
    position:absolute;left:0;top:0;bottom:0;width:7px;
    border-radius:10px 0 0 10px;
    background:var(--colore-filo,var(--spento));
  }
  .m-dati{--colore-filo:var(--spento)}
  .m-lavori{--colore-filo:var(--fase)}
  .m-orario{--colore-filo:var(--neutro)}
  .m-materiale{--colore-filo:var(--rame)}

  .titolo{
    font-family:'Chakra Petch',sans-serif;
    font-weight:700;font-size:15px;
    letter-spacing:1.5px;text-transform:uppercase;
    margin-bottom:10px;
    display:flex;align-items:center;gap:8px;
  }
  .titolo .tag{
    font-size:10.5px;letter-spacing:1px;color:#fff;
    background:var(--colore-filo,var(--spento));
    border-radius:3px;padding:2px 6px;
  }

  label{
    display:block;font-size:12.5px;font-weight:600;
    letter-spacing:.8px;text-transform:uppercase;
    color:#5A6068;margin-bottom:5px;
  }
  input,textarea{
    width:100%;
    border:1.5px solid var(--bordo);
    border-radius:7px;background:#fff;
    padding:13px 12px;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:17px;font-weight:500;color:var(--testo);
  }
  input:focus,textarea:focus{
    outline:2.5px solid var(--neutro);
    outline-offset:1px;border-color:var(--neutro);
  }
  input[type="date"],input[type="time"]{
    -webkit-appearance:none;appearance:none;
    min-height:50px;text-align:left;display:block;
  }
  input::-webkit-date-and-time-value{text-align:left;line-height:1.4}
  input[type="date"]::-webkit-calendar-picker-indicator{opacity:.6}
  textarea{resize:vertical;min-height:80px}
  .due{display:flex;gap:12px}
  .due>div{flex:1}

  /* ---- scheda per ogni cliente ---- */
  .cliente{
    border:1.5px solid var(--bordo);
    border-radius:8px;
    background:#FAFAFA;
    padding:12px;
    margin-bottom:12px;
  }
  .cliente .testata{
    display:flex;align-items:center;gap:10px;
    margin-bottom:10px;
  }
  .cliente .testata input{flex:1;min-width:0}
  .cliente .num{
    font-family:'Chakra Petch',sans-serif;
    font-weight:700;font-size:15px;
    width:30px;height:30px;flex:none;
    display:flex;align-items:center;justify-content:center;
    background:var(--quadro);color:var(--terra1);
    border-radius:5px;
  }
  .cliente button.togli{
    flex:none;width:34px;height:34px;
    border:none;border-radius:6px;
    background:transparent;color:#9AA1A9;
    font-size:22px;line-height:1;cursor:pointer;
  }
  .cliente .orari{display:flex;gap:10px;margin-bottom:10px}
  .cliente .orari>div{flex:1}
  .cliente textarea{min-height:70px}

  .aggiungi{
    margin-top:2px;width:100%;
    border:1.5px dashed var(--fase);
    background:transparent;color:var(--fase);
    font-family:'Chakra Petch',sans-serif;
    font-weight:700;font-size:14px;
    letter-spacing:1px;text-transform:uppercase;
    border-radius:7px;padding:12px;cursor:pointer;
  }

  .totore{margin-top:10px;font-size:14.5px;color:#5A6068}
  .totore b{color:var(--testo);font-size:17px;font-family:'Chakra Petch',sans-serif}

  .barra{
    position:fixed;left:0;right:0;bottom:0;
    background:var(--quadro);
    border-top:2px solid #14171A;
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  }
  .barra .dentro{max-width:560px;margin:0 auto;display:flex;gap:10px}
  .invia{
    flex:1;
    background:var(--terra1);color:var(--quadro);
    border:none;border-radius:8px;
    font-family:'Chakra Petch',sans-serif;
    font-weight:700;font-size:17px;
    letter-spacing:1px;text-transform:uppercase;
    padding:15px 8px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .invia svg{width:18px;height:18px;fill:var(--quadro);flex:none}
  .invia:active{transform:translateY(1px)}
  .secondario{
    flex:none;
    background:transparent;
    border:1.5px solid #4A5058;
    border-radius:8px;
    padding:0 14px;
    font-family:'Chakra Petch',sans-serif;
    font-weight:600;font-size:13.5px;
    letter-spacing:.5px;text-transform:uppercase;
    color:#C9CDD2;cursor:pointer;
  }
  .avviso{
    max-width:560px;margin:8px auto 0;
    text-align:center;font-size:12.5px;color:#9AA1A9;
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>
<div class="colonna">

  <header>
    <div class="fulmine" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
    </div>
    <div><h1>Rapporto di lavoro</h1></div>
  </header>
  <div class="terra" aria-hidden="true"></div>

  <div class="modulo m-dati">
    <div class="titolo">Dati <span class="tag">GEN</span></div>
    <div class="due">
      <div>
        <label for="data">Data</label>
        <input type="date" id="data">
      </div>
      <div>
        <label for="tecnici">Tecnici</label>
        <input type="text" id="tecnici" value="Luca / Francesco" autocomplete="off">
      </div>
    </div>
  </div>

  <div class="modulo m-lavori">
    <div class="titolo">Clienti e lavori <span class="tag">L1</span></div>
    <div id="clienti"></div>
    <button type="button" class="aggiungi" onclick="aggiungiCliente()">+ Aggiungi cliente</button>
  </div>

  <div class="modulo m-orario">
    <div class="titolo">Orario della giornata <span class="tag">N</span></div>
    <div class="due">
      <div>
        <label for="dalle">Dalle</label>
        <input type="time" id="dalle" value="08:00" onchange="calcolaOre()">
      </div>
      <div>
        <label for="alle">Alle</label>
        <input type="time" id="alle" value="17:00" onchange="calcolaOre()">
      </div>
    </div>
    <div class="totore">Totale: <b id="totore">9 ore</b></div>
  </div>

  <div class="modulo m-materiale">
    <div class="titolo">Materiale utilizzato <span class="tag">MAT</span></div>
    <textarea id="materiale" placeholder="Es. 8 m cavo 3x2,5 mm&#178;" aria-label="Materiale utilizzato"></textarea>
  </div>

</div>

<div class="barra">
  <div class="dentro">
    <button type="button" class="invia" onclick="inviaPDF()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
      Invia PDF
    </button>
    <button type="button" class="secondario" onclick="inviaTesto()">Testo</button>
  </div>
  <div class="avviso" id="avviso">Con "Invia PDF" scegli Mail o Gmail dal menu: il PDF è già allegato.</div>
</div>

<script>
const DESTINATARIO = "lcsoon93@gmail.com";

document.getElementById("data").value = new Date().toISOString().slice(0,10);

// ---- schede cliente: nome + orario + dettagli lavoro ----
function aggiungiCliente(){
  const div = document.createElement("div");
  div.className = "cliente";
  div.innerHTML =
    '<div class="testata">' +
      '<span class="num"></span>' +
      '<input type="text" class="c-nome" placeholder="Cliente / luogo" autocomplete="off">' +
      '<button type="button" class="togli" aria-label="Rimuovi cliente" onclick="togliCliente(this)">&times;</button>' +
    '</div>' +
    '<div class="orari">' +
      '<div><label>Dalle</label><input type="time" class="c-dalle"></div>' +
      '<div><label>Alle</label><input type="time" class="c-alle"></div>' +
    '</div>' +
    '<label>Dettagli lavoro eseguito</label>' +
    '<textarea class="c-dettagli" placeholder="Cosa avete fatto da questo cliente"></textarea>';
  document.getElementById("clienti").appendChild(div);
  rinumera();
  div.querySelector(".c-nome").focus();
}
function togliCliente(btn){
  btn.closest(".cliente").remove();
  rinumera();
}
function rinumera(){
  document.querySelectorAll("#clienti .cliente .num").forEach((n,i)=>n.textContent = i+1);
}
aggiungiCliente();
document.querySelector(".c-nome").blur();

// ---- ore totali giornata ----
function calcolaOre(){
  const d = document.getElementById("dalle").value;
  const a = document.getElementById("alle").value;
  const out = document.getElementById("totore");
  if(!d || !a){ out.textContent = "—"; return; }
  let mins = toMin(a) - toMin(d);
  if (mins < 0) mins += 24*60;
  const h = Math.floor(mins/60), m = mins%60;
  out.textContent = m ? h + " ore e " + m + " min" : h + " ore";
}
function toMin(t){ const p = t.split(":"); return +p[0]*60 + +p[1]; }
calcolaOre();

// ---- raccolta dati ----
function dataIt(){
  const v = document.getElementById("data").value;
  if(!v) return "";
  const p = v.split("-");
  return p[2] + "/" + p[1] + "/" + p[0];
}
function elencoClienti(){
  const out = [];
  document.querySelectorAll("#clienti .cliente").forEach(c=>{
    const nome = c.querySelector(".c-nome").value.trim();
    const dalle = c.querySelector(".c-dalle").value;
    const alle = c.querySelector(".c-alle").value;
    const dettagli = c.querySelector(".c-dettagli").value.trim();
    if(nome || dettagli) out.push({nome: nome || "(senza nome)", dalle, alle, dettagli});
  });
  return out;
}
function rigaOrarioCliente(c){
  if(c.dalle && c.alle) return " (" + c.dalle + " - " + c.alle + ")";
  if(c.dalle) return " (dalle " + c.dalle + ")";
  return "";
}

function testoRapporto(){
  const righe = [];
  righe.push("RAPPORTO DI LAVORO - " + dataIt());
  righe.push("Tecnici: " + document.getElementById("tecnici").value.trim());
  righe.push("");
  righe.push("LAVORI ESEGUITI:");
  const cl = elencoClienti();
  if(cl.length === 0) righe.push("-");
  cl.forEach((c,i)=>{
    righe.push("");
    righe.push((i+1) + ") " + c.nome + rigaOrarioCliente(c));
    if(c.dettagli) righe.push("   " + c.dettagli.replaceAll("\n","\n   "));
  });
  righe.push("");
  righe.push("ORARIO GIORNATA: " + document.getElementById("dalle").value + " - " + document.getElementById("alle").value +
             " (" + document.getElementById("totore").textContent + ")");
  righe.push("");
  righe.push("MATERIALE UTILIZZATO:");
  righe.push(document.getElementById("materiale").value.trim() || "-");
  return righe.join("\n");
}

// ---- generazione PDF ----
function generaPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"mm", format:"a4"});
  const ML = 18, MR = 18, W = 210, CW = W - ML - MR;
  let y = 22;

  function serveNuovaPagina(spazio){
    if (y + spazio > 275){ doc.addPage(); y = 22; }
  }

  // intestazione
  doc.setFillColor(34,38,43);
  doc.rect(ML, y-8, CW, 12, "F");
  doc.setTextColor(255,255,255);
  doc.setFont("helvetica","bold");
  doc.setFontSize(14);
  doc.text("RAPPORTO DI LAVORO GIORNALIERO", W/2, y, {align:"center"});
  doc.setTextColor(0,0,0);
  y += 14;

  doc.setFontSize(11);
  doc.text("Data: " + dataIt(), ML, y);
  doc.text("Tecnici: " + document.getElementById("tecnici").value.trim(), ML + 60, y);
  y += 11;

  // clienti
  doc.setFontSize(12);
  doc.text("LAVORI ESEGUITI", ML, y);
  y += 8;
  const cl = elencoClienti();
  if(cl.length === 0){
    doc.setFont("helvetica","normal"); doc.setFontSize(11);
    doc.text("-", ML, y); y += 8;
  }
  cl.forEach((c,i)=>{
    serveNuovaPagina(25);
    doc.setFont("helvetica","bold");
    doc.setFontSize(11.5);
    doc.text((i+1) + ")  " + c.nome + rigaOrarioCliente(c), ML, y);
    y += 6;
    if(c.dettagli){
      doc.setFont("helvetica","normal");
      doc.setFontSize(11);
      const righe = doc.splitTextToSize(c.dettagli, CW - 8);
      serveNuovaPagina(righe.length * 5.5 + 4);
      doc.text(righe, ML + 8, y);
      y += righe.length * 5.5 + 3;
    }
    y += 3;
  });
  y += 4;

  // orario giornata
  serveNuovaPagina(20);
  doc.setFont("helvetica","bold");
  doc.setFontSize(12);
  doc.text("ORARIO GIORNATA", ML, y);
  y += 7;
  doc.setFont("helvetica","normal");
  doc.setFontSize(11);
  doc.text("Dalle " + document.getElementById("dalle").value +
           "  alle " + document.getElementById("alle").value +
           "   —   Totale: " + document.getElementById("totore").textContent, ML, y);
  y += 11;

  // materiale
  serveNuovaPagina(25);
  doc.setFont("helvetica","bold");
  doc.setFontSize(12);
  doc.text("MATERIALE UTILIZZATO", ML, y);
  y += 7;
  doc.setFont("helvetica","normal");
  doc.setFontSize(11);
  const mat = document.getElementById("materiale").value.trim() || "-";
  const matRighe = doc.splitTextToSize(mat, CW);
  doc.text(matRighe, ML, y);
  y += matRighe.length * 6 + 5;

  // firma
  y = Math.max(y + 14, 250);
  if (y > 275){ doc.addPage(); y = 250; }
  doc.setFontSize(10);
  doc.text("Firma", W - MR - 60, y);
  doc.setLineWidth(0.3);
  doc.line(W - MR - 46, y + 1, W - MR, y + 1);

  return doc;
}

function nomeFile(){
  return "Rapporto_" + dataIt().replaceAll("/","-") + ".pdf";
}

// ---- invio PDF ----
async function inviaPDF(){
  const doc = generaPDF();
  const blob = doc.output("blob");
  const file = new File([blob], nomeFile(), {type:"application/pdf"});
  const oggetto = "Rapporto di lavoro " + dataIt();

  if (navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({
        files:[file],
        title: oggetto,
        text: "In allegato il rapporto di lavoro del " + dataIt() + ". Da inviare a: " + DESTINATARIO
      });
      return;
    }catch(e){
      if (e && e.name === "AbortError") return;
    }
  }
  doc.save(nomeFile());
  document.getElementById("avviso").textContent =
    "PDF scaricato: allegalo a una mail per " + DESTINATARIO + ".";
}

// ---- invio testo ----
function inviaTesto(){
  const oggetto = "Rapporto di lavoro " + dataIt();
  window.location.href = "mailto:" + DESTINATARIO +
    "?subject=" + encodeURIComponent(oggetto) +
    "&body=" + encodeURIComponent(testoRapporto());
}
</script>
</body>
</html>
